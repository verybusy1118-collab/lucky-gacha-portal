<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師工具小幫手 - 首頁</title>
    <!-- FontAwesome for cute icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for cute rounded text -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f7ede2; /* 溫暖的背景色，與圖片邊緣相近 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: auto; /* allow scrolling if needed */
            font-family: 'Nunito', sans-serif;
        }

        .image-container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
            min-height: 0; /* 允許圖片縮小以留出空間給按鈕 */
        }

        img {
            max-width: 95%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: fadeIn 0.8s ease-out;
            border-radius: 12px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 可愛標籤容器 */
        .tags-container {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 15px 20px;
            justify-content: center;
            width: 95%;
            max-width: 900px;
            padding-bottom: 30px;
            animation: bounceInUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s both;
        }

        @keyframes bounceInUp {
            0% { opacity: 0; transform: translate(-50%, 50px) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        /* 可愛按鈕樣式 */
        .cute-tag {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 4px solid #fff;
            color: #4b5563; /* 深灰字體 */
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1), inset 0 -3px 0 rgba(0,0,0,0.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        /* 微微交錯傾斜，創造活潑感 */
        .cute-tag:nth-child(odd) { transform: rotate(-3deg); }
        .cute-tag:nth-child(even) { transform: rotate(3deg); }

        .cute-tag:hover {
            transform: translateY(-8px) scale(1.08) rotate(0deg);
            z-index: 2;
            color: #fff;
            box-shadow: 0 15px 25px rgba(0,0,0,0.15), inset 0 -3px 0 rgba(0,0,0,0.1);
        }
        
        .cute-tag:active {
            transform: translateY(2px) scale(0.95) rotate(0deg);
        }

        /* 個別按鈕 Hover 背景顏色與邊框 */
        .cute-tag:nth-child(1):hover { background: #FF7E67; border-color: #FF7E67; }
        .cute-tag:nth-child(2):hover { background: #4ADE80; border-color: #4ADE80; }
        .cute-tag:nth-child(3):hover { background: #60A5FA; border-color: #60A5FA; }
        .cute-tag:nth-child(4):hover { background: #A78BFA; border-color: #A78BFA; }
        .cute-tag:nth-child(5):hover { background: #FBBF24; border-color: #FBBF24; }
        .cute-tag:nth-child(6):hover { background: #F472B6; border-color: #F472B6; }

        /* Icon 顏色預設狀態 */
        .cute-tag i { font-size: 1.3rem; transition: color 0.3s; }
        .cute-tag:nth-child(1) i { color: #FF7E67; }
        .cute-tag:nth-child(2) i { color: #4ADE80; }
        .cute-tag:nth-child(3) i { color: #60A5FA; }
        .cute-tag:nth-child(4) i { color: #A78BFA; }
        .cute-tag:nth-child(5) i { color: #FBBF24; }
        .cute-tag:nth-child(6) i { color: #F472B6; }

        /* Icon 顏色 Hover 狀態 */
        .cute-tag:hover i { color: #fff; }

        @media (max-width: 768px) {
            .tags-container {
                bottom: 2%;
                gap: 10px;
            }
            .cute-tag {
                padding: 10px 18px;
                font-size: 0.95rem;
                border-width: 3px;
            }
            .cute-tag i {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="image-container">
        <!-- 原本的首頁封面圖 -->
        <img src="cover.jpg" alt="教師工具小幫手封面">
    </div>
        
    <!-- 不再浮動，獨立於圖片下方的可愛標籤選單 -->
    <div class="tags-container">
            <button class="cute-tag" onclick="navTo('gacha.html', 1)">
                <i class="fa-solid fa-chalkboard-user"></i> 老師抽籤扭蛋機
            </button>
            <button class="cute-tag" onclick="navTo('class-gacha.html', 4)">
                <i class="fa-solid fa-users"></i> 班級學生扭蛋
            </button>
            <button class="cute-tag" onclick="navTo('healing-gacha.html', 3)">
                <i class="fa-solid fa-heart-circle-check"></i> 心靈解憂扭蛋機
            </button>
            <button class="cute-tag" onclick="navTo('emotion-index.html', 5)">
                <i class="fa-solid fa-face-smile-beam"></i> 專屬情緒地圖
            </button>
            <button class="cute-tag" onclick="navTo('clock.html', 2)">
                <i class="fa-solid fa-stopwatch"></i> 倒數計時小精靈
            </button>
            <button class="cute-tag" onclick="navTo('exam-timer.html', 6)">
                <i class="fa-solid fa-bell"></i> 考試重要提醒
            </button>
        </div>
    </div>

    <script>
        // 與上層 (index.html) 通訊的跳轉函式
        function navTo(url, btnIndex) {
            if (window.parent && window.parent.loadUrl) {
                // 呼叫 index.html 的 loadUrl 來切換 iframe 並更新上方選單狀態
                window.parent.loadUrl(url, btnIndex);
            } else {
                // 如果是獨立開啟 home.html，則直接跳轉
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
