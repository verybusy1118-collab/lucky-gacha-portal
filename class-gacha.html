    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+TC:wght@300..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background-color: #FFFDF3;
            background-image: radial-gradient(#FDE047 8%, transparent 8%);
            background-size: 24px 24px;
        }
        
        /* 玻璃擬真質感 */
        .glass-dome {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            backdrop-filter: blur(5px);
            border: 8px solid #FBCFE8;
        }

        /* 扭蛋旋轉與跳躍動畫 (在原定格位置附近進行生動的晃動，確保不破壞整體排列) */
        @keyframes capsule-bounce {
            0%, 100% { transform: translate(0, 0) scale(1); }
            15% { transform: translate(-8px, -15px) rotate(15deg) scale(1.05); }
            30% { transform: translate(8px, 10px) rotate(-15deg) scale(0.95); }
            45% { transform: translate(-10px, -8px) rotate(10deg); }
            60% { transform: translate(10px, 8px) rotate(-10deg); }
            75% { transform: translate(-4px, -4px) rotate(5deg); }
            90% { transform: translate(2px, 2px) rotate(-2deg); }
        }

        .capsule-shake {
            animation: capsule-bounce 1.8s ease-in-out infinite;
        }

        /* 旋鈕旋轉動畫 */
        @keyframes knob-turn {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .turn-knob {
            animation: knob-turn 0.8s ease-in-out;
        }

        /* 獎勵球掉落動畫 */
        @keyframes ball-drop {
            0% { transform: translateY(-50px) scale(0.3); opacity: 0; }
            40% { transform: translateY(40px) scale(1); opacity: 1; }
            70% { transform: translateY(15px) scale(1.1); }
            100% { transform: translateY(25px) scale(1.1); }
        }

        .drop-capsule {
            animation: ball-drop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 遮罩彈出動畫 */
        @keyframes modal-pop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: modal-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 自訂細緻滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FEF3C7;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #FBBF24;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #F59E0B;
        }
    </style>

    <script>
        // ----------------- 音效合成模組 (Web Audio API) -----------------
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 1. 旋轉旋鈕音效
        function playTwistSound() {
            if (!soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }

        // 2. 扭蛋機震動滾動音效
        function playShakeSound() {
            if (!soundEnabled) return;
            initAudio();
            let duration = 1.6;
            let startTime = audioCtx.currentTime;
            
            let interval = setInterval(() => {
                if (audioCtx.currentTime - startTime > duration) {
                    clearInterval(interval);
                    return;
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(100 + Math.random() * 150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            }, 80);
        }

        // 3. 得獎開獎慶祝音效
        function playWinSound() {
            if (!soundEnabled) return;
            initAudio();
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.4);
                osc.start(audioCtx.currentTime + index * 0.1);
                osc.stop(audioCtx.currentTime + index * 0.1 + 0.4);
            });
        }

        // ----------------- 預設 30 個獎項 -----------------
        const DEFAULT_REWARDS = [
            // 課堂特權
            { id: "p1", name: "午餐時間第一位享用午餐", category: "課堂特權" },

            { id: "p10", name: "可優先分享自己的作品", category: "課堂特權" },
            // 幽默互動
            { id: "h1", name: "和同學擊掌三次", category: "幽默互動" },
            { id: "h2", name: "模仿一種動物 5 秒", category: "幽默互動" },
            { id: "h3", name: "用超級英雄語氣說一句鼓勵話", category: "幽默互動" },
            { id: "h4", name: "找一位同學互相稱讚", category: "幽默互動" },
            { id: "h5", name: "擺出勝利姿勢拍照", category: "幽默互動" },
            { id: "h6", name: "對全班說一句今天的開心事", category: "幽默互動" },
            { id: "h7", name: "和旁邊同學做一個搞笑表情", category: "幽默互動" },
            { id: "h8", name: "用機器人聲音說「我完成任務了」", category: "幽默互動" },
            { id: "h9", name: "抽一位同學一起比愛心", category: "幽默互動" },
            { id: "h10", name: "說出一個讓大家微笑的句子", category: "幽默互動" },
            // 小獎勵

        // ----------------- 應用程式狀態 -----------------
        let rewards = [];

        // ----------------- 高相容性一鍵複製函式 (相容 iframe 與多端瀏覽器) -----------------
        function executeCopy(text, buttonElement) {
            if (!text) return;
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            tempInput.style.position = 'fixed'; // 避免頁面滾動
            document.body.appendChild(tempInput);
            tempInput.select();
            
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                success = false;
            }
            document.body.removeChild(tempInput);

            // 更新複製按鈕狀態
            if (success) {
                const originalHTML = buttonElement.innerHTML;
                buttonElement.innerHTML = `<i class="fa-solid fa-check"></i> <span>已複製 ✔</span>`;
                buttonElement.classList.remove('bg-rose-500', 'hover:bg-rose-600', 'bg-amber-500', 'hover:bg-amber-600');
                buttonElement.classList.add('bg-emerald-500', 'text-white');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalHTML;
                    buttonElement.classList.remove('bg-emerald-500');
                    if (buttonElement.id === 'btn-modal-copy') {
                        buttonElement.classList.add('bg-rose-500', 'hover:bg-rose-600');
                    } else {
                        buttonElement.classList.add('bg-amber-500', 'hover:bg-amber-600');
                    }
                }, 1500);
            }
        }

        // ----------------- 載入/保存 LocalStorage -----------------
        function initApp() {
            const localRewards = localStorage.getItem('gashapon_rewards');
            if (localRewards) {
                rewards = JSON.parse(localRewards);
            } else {
                rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS));
                saveRewards();
            }

            const localSound = localStorage.getItem('gashapon_sound');
            if (localSound !== null) {
                soundEnabled = localSound === 'true';
            }
            updateSoundUI();

            const localFilters = localStorage.getItem('gashapon_filters');
            if (localFilters) {
                const filters = JSON.parse(localFilters);
                chkPrivilege.checked = filters.privilege;
                chkHumor.checked = filters.humor;
                chkReward.checked = filters.reward;
            }

            renderRewards();
            renderCapsulesInDome();
        }

        function saveRewards() {
            localStorage.setItem('gashapon_rewards', JSON.stringify(rewards));
        }

        function saveFilters() {
            const filters = {
                privilege: chkPrivilege.checked,
                humor: chkHumor.checked,
                reward: chkReward.checked
            };
            localStorage.setItem('gashapon_filters', JSON.stringify(filters));
        }

        // ----------------- 自訂對話框 -----------------
        function showCustomAlert(title, text, isConfirm = false, onConfirm = null) {
            alertTitle.textContent = title;
            alertMessage.textContent = text;
            alertIcon.textContent = isConfirm ? "❓" : "⚠️";

            if (isConfirm) {
                btnAlertCancel.classList.remove('hidden');
                btnAlertCancel.textContent = "取消";
            } else {
                btnAlertCancel.classList.add('hidden');
            }

            customAlertModal.classList.remove('hidden');

            btnAlertConfirm.onclick = () => {
                customAlertModal.classList.add('hidden');
                if (onConfirm) onConfirm();
            };

            btnAlertCancel.onclick = () => {
                customAlertModal.classList.add('hidden');
            };
        }

        // ----------------- UI 渲染與綁定 -----------------
        function getCategoryStyle(category) {
            switch(category) {
                case '課堂特權':
                    return { bg: 'bg-purple-100', text: 'text-purple-700', border: 'border-purple-200' };
                case '幽默互動':
                    return { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-200' };
                case '小獎勵':
                    return { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-200' };
                default:
                    return { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-200' };
            }
        }

        function renderRewards() {
            rewardListContainer.innerHTML = '';
            rewardCountEl.textContent = rewards.length;

            rewards.forEach(reward => {
                const style = getCategoryStyle(reward.category);
                
                const card = document.createElement('div');
                card.className = `flex justify-between items-center p-2.5 rounded-xl border ${style.bg} ${style.border} transition duration-200 hover:shadow-sm`;

                card.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden flex-1">
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-black ${style.text} bg-white bg-opacity-70 border border-current flex-shrink-0">
                            ${reward.category}
                        </span>
                        <span class="text-xs font-bold text-amber-950 truncate">${reward.name}</span>
                    </div>
                    <button class="text-slate-400 hover:text-rose-500 p-1.5 transition text-xs flex-shrink-0" onclick="deleteReward('${reward.id}')">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                rewardListContainer.appendChild(card);
            });

            if (rewards.length === 0) {
                rewardListContainer.innerHTML = `
                    <div class="text-center py-8 text-amber-700 font-bold text-xs opacity-75">
                        目前沒有任何獎項，請點擊下方重設或自行新增。
                    </div>
                `;
            }
        }

        // ----------------- 日系可愛貼紙感格柵避碰擺放 -----------------
        // 精準模擬 Gemini-直接與-Google-AI-互動-06-29-2026_02_41_PM.png
        // 使用定點百分比座標系統，28個位置排列成圓形。
        const capsuleColors = [
            { main: '#FF9FB2', border: '#FF5E7E' },  // 夢幻粉紅
            { main: '#C4B1FC', border: '#8E75E3' },  // 氣質紫
            { main: '#84E4E4', border: '#29BCBC' }   // 活力藍綠
        ];

        const capsuleGridPositions = [
            // Row 0 (最頂端，部分被遮罩切除，營造裝滿感)
            { x: 10, y: 3 }, { x: 28, y: 2 }, { x: 46, y: 1 }, { x: 64, y: 2 }, { x: 82, y: 3 },
            // Row 1
            { x: 10, y: 19 }, { x: 28, y: 18 }, { x: 46, y: 18 }, { x: 64, y: 18 }, { x: 82, y: 19 },
            // Row 2
            { x: 10, y: 35 }, { x: 28, y: 34 }, { x: 46, y: 34 }, { x: 64, y: 34 }, { x: 82, y: 35 },
            // Row 3
            { x: 10, y: 51 }, { x: 28, y: 50 }, { x: 46, y: 50 }, { x: 64, y: 50 }, { x: 82, y: 51 },
            // Row 4
            { x: 10, y: 67 }, { x: 28, y: 66 }, { x: 46, y: 66 }, { x: 64, y: 66 }, { x: 82, y: 67 },
            // Row 5 (底層收窄，貼合圓形底緣，絕不堆疊卡死)
            { x: 28, y: 82 }, { x: 46, y: 82 }, { x: 64, y: 82 }
        ];

        function renderCapsulesInDome() {
            capsulesContainer.innerHTML = '';
            
            capsuleGridPositions.forEach((pos, index) => {
                // 輪流分配馬卡龍色彩
                const color = capsuleColors[index % capsuleColors.length];
                const ballEl = document.createElement('div');
                const rotate = Math.floor(Math.random() * 30) - 15; // 微幅隨機旋轉，呈現生動感
                
                // 隨機選定中央點飾：星星(★) 或 經典雙條紋(||)
                const useStar = index % 2 === 0;
                let centerIconHTML = '';
                if (useStar) {
                    centerIconHTML = `<span class="text-white text-md font-black select-none opacity-90 drop-shadow-[0_1px_1px_rgba(0,0,0,0.15)]">★</span>`;
                } else {
                    centerIconHTML = `
                        <div class="flex gap-0.5 opacity-90 drop-shadow-[0_1px_1px_rgba(0,0,0,0.15)]">
                            <div class="w-1.5 h-3.5 bg-white rounded-full"></div>
                            <div class="w-1.5 h-3.5 bg-white rounded-full"></div>
                        </div>
                    `;
                }

                // 套用高階日系泡泡糖 sticker 質感：
                // 3px 貼紙暗描邊、頂部白色亮反光條 (Glossy Pillar)、下半部陰影、柔和內透光 shadow
                ballEl.className = `capsule-item absolute rounded-full flex items-center justify-center shadow-lg transform transition-all duration-300`;
                ballEl.style.width = '14.5%';
                ballEl.style.height = '14.5%';
                ballEl.style.left = `${pos.x}%`;
                ballEl.style.top = `${pos.y}%`;
                ballEl.style.backgroundColor = color.main;
                ballEl.style.border = `3px solid ${color.border}`;
                ballEl.style.boxShadow = '0 4px 6px rgba(0,0,0,0.15), inset 0 -4px 0 rgba(0,0,0,0.18)';
                ballEl.style.transform = `rotate(${rotate}deg)`;
                
                // 記錄原始相對座標以便搖晃完完美歸位
                ballEl.dataset.origX = pos.x;
                ballEl.dataset.origY = pos.y;
                ballEl.dataset.origRotate = rotate;

                ballEl.innerHTML = `
                    <!-- 頂端高反光飾條 (Glossy Highlight) -->
                    <div class="absolute top-1 left-2 w-3.5 h-1.5 bg-white rounded-full opacity-60 transform -rotate-12"></div>
                    <!-- 內部可愛經典符號 -->
                    ${centerIconHTML}

                capsulesContainer.appendChild(ballEl);
            });
        }

        // ----------------- 控制台按鈕事件 -----------------
        btnAddReward.addEventListener('click', () => {
            const text = newRewardText.value.trim();
            const category = newRewardCategory.value;

            if (!text) {
                showCustomAlert("注意囉！", "請輸入獎項名稱，不能空白唷！");
                return;
            }

            const newId = 'reward_' + Date.now();
            rewards.unshift({ id: newId, name: text, category: category });
            saveRewards();
            renderRewards();
            newRewardText.value = '';
            
            shakeCapsules(true);
        });

        window.deleteReward = function(id) {
            rewards = rewards.filter(item => item.id !== id);
            saveRewards();
            renderRewards();
        };

        function updateSoundUI() {
            if (soundEnabled) {
                soundIcon.className = "fa-solid fa-volume-high";
                soundStatusText.textContent = "開啟";
                btnToggleSound.className = "flex-1 py-2 bg-emerald-400 hover:bg-emerald-500 text-white font-black rounded-xl shadow-md transition active:scale-95 text-xs sm:text-sm flex items-center justify-center gap-2";
            } else {
                soundIcon.className = "fa-solid fa-volume-xmark";
                soundStatusText.textContent = "關閉";
                btnToggleSound.className = "flex-1 py-2 bg-slate-400 hover:bg-slate-500 text-white font-black rounded-xl shadow-md transition active:scale-95 text-xs sm:text-sm flex items-center justify-center gap-2";
            }
        }

        btnToggleSound.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('gashapon_sound', soundEnabled);
            updateSoundUI();
            if (soundEnabled) {
                initAudio();
                playTwistSound();
            }
        });

        btnReset.addEventListener('click', () => {
            showCustomAlert("重設確認", "郭小貞老師，確認要將所有獎項恢復成預設的 30 個嗎？這會清除您目前的新增紀錄喔！", true, () => {
                rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS));
                saveRewards();
                renderRewards();
                renderCapsulesInDome();
                playWinSound();
            });
        });

        [chkPrivilege, chkHumor, chkReward].forEach(chk => {
            chk.addEventListener('change', saveFilters);
        });

        // ----------------- 抽獎動畫與物理還原 -----------------
        function shakeCapsules(isMinor = false) {
            const items = document.querySelectorAll('.capsule-item');
            items.forEach(item => {
                item.style.animation = isMinor 
                    ? 'capsule-bounce 0.8s ease-in-out' 
                    : 'capsule-bounce 1.8s ease-in-out';
                
                // 模擬劇烈旋轉跳動時的隨機飛散位移 (在各自定點周圍大幅度彈跳)
                const randomX = (Math.random() - 0.5) * (isMinor ? 8 : 45);
                const randomY = (Math.random() - 0.5) * (isMinor ? 8 : 45);
                
                item.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${Math.random() * 360}deg)`;
            });

            // 確保彈跳完畢後，百分之百精準還原到無重疊的原始美學格柵座標
            setTimeout(() => {
                items.forEach(item => {
                    item.style.animation = '';
                    item.style.transform = `rotate(${item.dataset.origRotate}deg)`;
                    item.style.left = `${item.dataset.origX}%`;
                    item.style.top = `${item.dataset.origY}%`;
                });
            }, isMinor ? 800 : 1800);
        }

        function getCheckedCategories() {
            const list = [];
            if (chkPrivilege.checked) list.push("課堂特權");
            if (chkHumor.checked) list.push("幽默互動");
            if (chkReward.checked) list.push("小獎勵");
            return list;
        }

        gashaponKnob.addEventListener('click', startLottery);

        function startLottery() {
            if (isSpinning) return;

            const activeCategories = getCheckedCategories();
            if (activeCategories.length === 0) {
                showCustomAlert("提醒您", "請至少選擇一個抽獎範圍喔！");
                return;
            }

            const activePool = rewards.filter(item => activeCategories.includes(item.category));
            if (activePool.length === 0) {
                showCustomAlert("注意囉！", "您勾選的分類中目前沒有任何獎項。請先到控制台新增或重設獎項！");
                return;
            }

            isSpinning = true;
            gashaponKnob.style.pointerEvents = "none";
            
            playTwistSound();
            playShakeSound();

            gashaponKnob.classList.add('turn-knob');
            shakeCapsules(false);

            prizeTray.innerHTML = `<span class="text-rose-500 animate-pulse"><i class="fa-solid fa-spinner animate-spin"></i> 扭蛋旋轉中，驚喜即將誕生...</span>`;

            lastSelectedPrizeText = luckyReward.name; // 記錄最後得獎內容

            // 出球落道動畫
            setTimeout(() => {
                dispenseCapsuleAnimation(luckyReward.category);
            }, 1000);

            // 展開驚喜大彈窗
            setTimeout(() => {
                showWinModal(luckyReward);
                gashaponKnob.classList.remove('turn-knob');
                gashaponKnob.style.pointerEvents = "auto";
                isSpinning = false;
            }, 2000);
        }

        function dispenseCapsuleAnimation(category) {
            dispensingCapsule.className = "absolute w-8 h-8 rounded-full z-30 drop-capsule flex flex-col overflow-hidden border border-black border-opacity-20";
            
            // 隨機選一組色票供掉落球使用
            const color = capsuleColors[Math.floor(Math.random() * capsuleColors.length)];

            dispensingCapsule.style.backgroundColor = color.main;
            dispensingCapsule.style.border = `2px solid ${color.border}`;
            dispensingCapsule.style.boxShadow = '0 2px 4px rgba(0,0,0,0.2)';
            dispensingCapsule.innerHTML = `
                <div class="absolute top-0.5 left-1 w-2 h-1 bg-white rounded-full opacity-60 transform -rotate-12"></div>
                <span class="text-white text-[8px] font-black select-none opacity-80 m-auto">★</span>
            `;
            dispensingCapsule.classList.remove('hidden');

            setTimeout(() => {
                dispensingCapsule.classList.add('hidden');
                dispensingCapsule.classList.remove('drop-capsule');
            }, 900);
        }

        function showWinModal(reward) {
            playWinSound();

            const style = getCategoryStyle(reward.category);
            modalPrizeTag.className = `inline-block px-4 py-1.5 rounded-full text-sm font-black mb-4 shadow bg-white border border-2 ${style.text}`;
            modalPrizeTag.textContent = reward.category;
            modalPrizeTitle.textContent = reward.name;

            modalCapsuleLeft.className = "w-14 h-14 border-4 rounded-l-full transform transition-all duration-700 ease-out";
            modalCapsuleRight.className = "w-14 h-14 border-4 rounded-r-full transform transition-all duration-700 ease-out";
            
            // 對應色調
            const color = capsuleColors[Math.floor(Math.random() * capsuleColors.length)];

            modalCapsuleLeft.style.backgroundColor = color.main;
            modalCapsuleLeft.style.borderColor = color.border;
            modalCapsuleRight.style.backgroundColor = '#FFFFFF';
            modalCapsuleRight.style.borderColor = color.border;

            winModal.classList.remove('hidden');

            setTimeout(() => {
                modalCapsuleLeft.style.transform = "translateX(-25px) rotate(-35deg)";
                modalCapsuleRight.style.transform = "translateX(25px) rotate(35deg)";
            }, 100);

            // 更新下方得獎托盤內容 (附帶高相容一鍵複製按鈕)
            prizeTray.innerHTML = `
                <div class="bg-white rounded-xl p-3 border border-amber-300 shadow-md animate-fade-in flex flex-col items-center gap-2">
                    <div class="text-center">
                        <span class="inline-block text-[10px] px-2.5 py-0.5 rounded-full font-black ${style.text} bg-amber-50 mb-1 border border-current">
                            ${reward.category}
                        </span>
                        <p id="tray-prize-text" class="text-sm md:text-base font-black text-amber-900 leading-snug">${reward.name}</p>
                    </div>
                    <button id="btn-tray-copy" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white font-black text-xs rounded-lg shadow-sm transition active:scale-95 flex items-center gap-1">
                        <i class="fa-regular fa-copy"></i>
                        <span>複製內容</span>
                    </button>
                </div>
            `;

            // 綁定托盤複製按鈕事件
            document.getElementById('btn-tray-copy').addEventListener('click', function() {
                executeCopy(reward.name, this);
            });
        }

        // 彈窗複製按鈕事件
        btnModalCopy.addEventListener('click', function() {
            executeCopy(lastSelectedPrizeText, this);
        });

        btnCloseWin.addEventListener('click', () => {
            winModal.classList.add('hidden');
        });

        winModal.addEventListener('click', (e) => {
            if (e.target === winModal) {
                winModal.classList.add('hidden');
            }
        });

        // ----------------- 初始化應用 -----------------
        window.onload = function() {
            initApp();
        };

    </script>
