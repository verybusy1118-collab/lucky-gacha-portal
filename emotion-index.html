<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情緒儀表 - 你的情緒座標</title>
  <link rel="stylesheet" href="emotion-style.css">
</head>
<body>
  <div class="nav-links">
    <a href="emotion-dashboard.html">後台統計 Dashboard &rarr;</a>
  </div>

  <div class="container">
    <div id="app-screen" class="app-screen" style="display: flex;">
      <div class="header">
        <h1 style="margin-bottom: 0.5rem;">探索你的情緒座標</h1>
        <p>請輸入你的名字與狀態，並將圖騰移動到你的專屬情緒位置</p>
      </div>

      <div class="glass-panel" style="width: 100%; max-width: 800px; padding: 1.5rem; margin-bottom: 1rem;">
        <form id="setup-form" class="setup-form" style="max-width: 100%; display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 1rem; align-items: center; margin: 0;">
          <div class="input-group">
            <label for="user-name">你的名字</label>
            <input type="text" id="user-name" placeholder="例如：小明" required maxlength="10">
          </div>
          <div class="input-group">
            <label for="user-desc">形容自己的一句話</label>
            <input type="text" id="user-desc" placeholder="例如：今天充滿幹勁！" required maxlength="50">
          </div>
          <div class="input-group">
            <label for="group-code">日期 (選填)</label>
            <input type="text" id="group-code" placeholder="例如：0701" maxlength="20">
          </div>
        </form>
      </div>

      <div class="map-container" id="map-container">
        <!-- 10x10 Grid injected via grid.js -->
        <div class="mood-grid"></div>
        
        <!-- Axes -->
        <div class="axis-x"></div>
        <div class="axis-y"></div>
        <div class="axis-label label-top">高能量</div>
        <div class="axis-label label-bottom">低能量</div>
        <div class="axis-label label-left">低愉悅</div>
        <div class="axis-label label-right">高愉悅</div>

        <!-- Draggable Avatar -->
        <div id="avatar" class="avatar-3d" style="display: flex; left: 50%; top: 50%;">
          <span id="avatar-emoji" style="font-size: 40px; line-height: 1;">🐶</span>
        </div>
      </div>

      <div class="controls">
        <button id="btn-submit" class="btn" style="width: 200px;">確認送出</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="firebase-config.js"></script>
  <script src="emotion-grid.js"></script>
  <script src="emotion-app.js"></script>
    <!-- ?函?閬?餈?擐??? -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.self === window.top) {
                const backBtn = document.createElement("a");
                backBtn.href = "index.html";
                backBtn.className = "back-to-home-btn";
                backBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;"><path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" /><path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.432z" /></svg> 餈?擐?';
                
                const style = document.createElement("style");
                style.innerHTML = \
                    .back-to-home-btn {
                        position: fixed;
                        top: 15px;
                        left: 15px;
                        background: rgba(255, 255, 255, 0.85);
                        backdrop-filter: blur(8px);
                        -webkit-backdrop-filter: blur(8px);
                        color: #4F46E5;
                        padding: 10px 18px;
                        border-radius: 50px;
                        font-size: 0.95rem;
                        font-weight: 800;
                        text-decoration: none;
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        box-shadow: 0 4px 10px rgba(0,0,0,0.1), inset 0 0 0 2px rgba(79, 70, 229, 0.1);
                        z-index: 999999;
                        transition: all 0.2s ease;
                        font-family: 'Inter', 'Nunito', sans-serif;
                    }
                    .back-to-home-btn:hover {
                        background: #4F46E5;
                        color: white;
                        transform: translateY(-2px);
                        box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
                        border-color: transparent;
                    }
                \;
                document.head.appendChild(style);
                document.body.appendChild(backBtn);
            }
        });
    </script>
