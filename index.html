<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小工具整合入口</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0F172A;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #818CF8, #34D399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        button.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
        }

        .external-link {
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }

        .external-link:hover {
            color: var(--text-main);
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #ffffff; /* Default white background for iframes */
            margin: 1rem;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(79, 70, 229, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        .error-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-align: center;
            color: #fff;
            max-width: 400px;
        }

        .error-message h3 {
            color: #FCA5A5;
            margin-top: 0;
        }

        .error-message p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .error-message a {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .error-message a:hover {
            background: var(--primary-hover);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }
            .iframe-container {
                margin: 0;
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-bottom: none;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">老師的小幫手工具</div>
        <div class="controls">
            <button id="btn-0" onclick="loadUrl('home.html', 0)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                首頁
            </button>
            <button id="btn-1" onclick="loadUrl('gacha.html', 1)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                老師抽籤扭蛋機
            </button>
            <button id="btn-4" onclick="loadUrl('class-gacha.html', 4)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                班級學生扭蛋
            </button>
            <button id="btn-3" onclick="loadUrl('healing-gacha.html', 3)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                心靈解憂扭蛋機
            </button>
            <button id="btn-5" onclick="loadUrl('emotion-index.html', 5)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                專屬情緒地圖
            </button>
            <button id="btn-2" onclick="loadUrl('clock.html', 2)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                倒數計時小精靈
            </button>
            <button id="btn-6" onclick="loadUrl('exam-timer.html', 6)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                考試重要提醒
            </button>
            <button id="btn-7" onclick="loadUrl('class-assistant.html', 7)">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                班務小秘書
            </button>
            <a id="ext-link" href="#" target="_blank" class="external-link" title="在新視窗開啟">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
        </div>
    </header>

    <div class="iframe-container">
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span>載入中...</span>
        </div>
        
        <div class="error-message" id="error-msg">
            <h3>無法在框架中顯示</h3>
            <p>這個網站 (Gemini) 具有安全限制，不允許被嵌入至其他網頁中。<br>請點擊下方按鈕在新視窗中開啟瀏覽。</p>
            <a id="error-ext-link" href="#" target="_blank">在新視窗開啟</a>
        </div>

        <iframe id="main-frame" onload="frameLoaded()" onerror="frameError()"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('main-frame');
        const loader = document.getElementById('loader');
        const extLink = document.getElementById('ext-link');
        const errorMsg = document.getElementById('error-msg');
        const errorExtLink = document.getElementById('error-ext-link');

        // Initial load
        window.onload = () => {
            document.getElementById('btn-0').click(); // Load the home cover by default
        };

        function loadUrl(url, btnIndex) {
            // Update active button state
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            if(btnIndex !== null) {
                const activeBtn = document.getElementById('btn-' + btnIndex);
                if(activeBtn) activeBtn.classList.add('active');
            }

            // Set links
            extLink.href = url;
            errorExtLink.href = url;

            // Reset UI
            loader.style.display = 'flex';
            errorMsg.style.display = 'none';
            iframe.style.opacity = '0';

            // Cache buster for development updates
            const cacheBustedUrl = url + (url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
            iframe.src = cacheBustedUrl;
        }

        function frameLoaded() {
            if(iframe.src && iframe.src !== 'about:blank' && iframe.src !== window.location.href) {
                loader.style.display = 'none';
                iframe.style.opacity = '1';
                errorMsg.style.display = 'none';
            }
        }

        function frameError() {
            loader.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
