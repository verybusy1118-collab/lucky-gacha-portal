<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒數計時小精靈</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        #add-timer-button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #add-timer-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #message-box {
            background-color: #f44336;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        .timer-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .timer {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .timer:hover {
            transform: translateY(-5px);
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .timer input {
            width: 60px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 1.2em;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .timer button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .timer button:last-of-type {
            background: #e74c3c;
        }

        .display-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .hourglass {
            color: #95a5a6;
            font-size: 2.5em;
        }

        .hourglass.active {
            animation: spin 2s linear infinite;
            color: #3498db;
        }

        .display {
            font-size: 3.5em;
            color: #2c3e50;
            font-weight: bold;
            min-width: 180px;
            text-align: center;
        }

        .acknowledge-btn {
            background: #f39c12 !important;
            margin-top: 15px;
            width: 100%;
            padding: 12px !important;
            font-size: 1.2em !important;
            display: none;
        }

        .retry-countdown {
            font-size: 1em;
            color: #e74c3c;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .sound-selector-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .sound-selector-row select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .sound-selector-row button {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .sound-selector-row button:hover {
            background: #2c3e50;
        }


        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes flash {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.5; }
        }

        .timer.time-up {
            animation: flash 1s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            .timer {
                width: calc(100% - 40px);
                max-width: 320px;
            }

            .display {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>倒數計時小精靈</h1>
        <div class="header-buttons">
            <button onclick="addTimer()" id="add-timer-button">新增小鬧鐘</button>
        </div>
        <div id="message-box"></div>
    </div>
    
    <!-- 全局背景音樂設定 -->
    <div class="bgm-container" style="background: white; border-radius: 15px; padding: 15px; text-align: center; margin: 0 auto 20px auto; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h3 style="margin-top: 0; color: #2c3e50; font-size: 1.2em;">🎵 背景音樂設定</h3>
        <p style="font-size: 0.9em; color: #7f8c8d; margin-bottom: 10px;">(可選擇電腦中的音樂，倒數期間將自動循環播放)</p>
        <input type="file" id="global-bgm-file" accept="audio/*" style="margin-bottom: 10px;">
        <div>
            <label style="cursor: pointer; font-weight: bold;"><input type="checkbox" id="global-bgm-enable" checked> 啟用背景音樂</label>
        </div>
        <audio id="global-bgm-audio" loop></audio>
    </div>
    <div class="timer-container" id="timer-container"></div>
    <div class="timer-container" id="extra-timer-container"></div>

    <script>
        let timerCount = 0;
        const timers = {};
        const audioPlayers = {};

        // BGM variables and logic
        let globalBgmAudio = null;
        let globalBgmEnable = null;

        document.addEventListener('DOMContentLoaded', () => {
            globalBgmAudio = document.getElementById('global-bgm-audio');
            globalBgmEnable = document.getElementById('global-bgm-enable');
            const globalBgmFile = document.getElementById('global-bgm-file');

            globalBgmFile.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    globalBgmAudio.src = url;
                }
            });

            globalBgmEnable.addEventListener('change', updateGlobalBGM);
        });

        function updateGlobalBGM() {
            if (!globalBgmAudio || !globalBgmEnable) return;
            
            if (!globalBgmEnable.checked) {
                globalBgmAudio.pause();
                return;
            }
            
            // Check if any timer is running
            let anyRunning = false;
            for (let id in timers) {
                if (timers[id].interval !== null && !timers[id].isPaused) {
                    anyRunning = true;
                    break;
                }
            }

            if (anyRunning && globalBgmAudio.src) {
                globalBgmAudio.play().catch(e => console.log("BGM play failed:", e));
            } else {
                globalBgmAudio.pause();
            }
        }

        const alarmSounds = [
            { name: "小刀會", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/Chinese_traditional_music.mp3" },
            { name: "馬力歐", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/MarioGameOver.mp3" },
            { name: "庫巴", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/Koopa.mp3" },
            { name: "天線寶寶", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/teletubbies.mp3" },
            { name: "TBVS", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/TVBS.mp3" },
            { name: "bibo", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/bibo.mp3" },
            { name: "換幕", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/doraemon_begin.mp3" },
            { name: "道具", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/doraemon_take.mp3" },
            { name: "維士比", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/WHISBIH.mp3" },
            { name: "每日一字", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/word.mp3" },
            { name: "歌仔戲", url: "https://filedn.eu/ldt9Roov20oh8G5emLf3VCj/sounds/Gezi_Opera.mp3" }
        ];

        function showMessage(message, type = 'error') {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = message;
            msgBox.style.display = 'block';
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 3000);
        }

        function addTimer() {
            if (timerCount >= 6) {
                showMessage('最多只能同時設置6個計時器！');
                return;
            }

            timerCount++;
            const timerId = `timer-${timerCount}`;
            const timerDiv = document.createElement('div');
            timerDiv.className = 'timer';
            timerDiv.id = timerId;
            
            timers[timerId] = {
                interval: null,
                remainingTime: 0,
                isPaused: false,
                retryTimeout: null,
                retryCountdownInterval: null
            };

            const soundOptions = alarmSounds.map((sound, index) =>
                `<option value="${sound.url}" ${index === 0 ? 'selected' : ''}>${sound.name}</option>`
            ).join('');

            timerDiv.innerHTML = `
                <div class="timer-info-inputs" style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
                    <input type="text" id="group-${timerId}" placeholder="小組" style="width: 80px; padding: 8px; text-align: center; border: 1px solid #ddd; border-radius: 5px; font-size: 1em;">
                    <input type="text" id="name-${timerId}" placeholder="姓名" style="width: 100px; padding: 8px; text-align: center; border: 1px solid #ddd; border-radius: 5px; font-size: 1em;">
                </div>
                <div class="timer-inputs">
                    <input type="number" id="minutes-${timerId}" value="5" min="0"> <label>分</label>
                    <input type="number" id="seconds-${timerId}" value="0" min="0" max="59"> <label>秒</label>
                </div>
                <div class="sound-selector-row">
                    <label>提醒音：</label>
                    <select id="sound-select-${timerId}" onchange="changeSoundSource('${timerId}')">
                        ${soundOptions}
                    </select>
                    <button onclick="testSound('${timerId}')"><i class="fas fa-volume-up"></i> 測試</button>
                </div>
                <div class="timer-controls">
                    <button onclick="startTimer('${timerId}')">開始</button>
                    <button onclick="resetTimer('${timerId}')">重置</button>
                    <button onclick="togglePauseTimer('${timerId}')" id="pause-btn-${timerId}">暫停</button>
                </div>
                <div class="display-container">
                    <i class="fas fa-hourglass hourglass" id="hourglass-${timerId}"></i>
                    <div id="display-${timerId}" class="display">05:00</div>
                </div>
                <button onclick="acknowledgeTimer('${timerId}')" id="acknowledge-${timerId}" class="acknowledge-btn">朕知道了</button>
                <div id="retry-countdown-${timerId}" class="retry-countdown"></div>
                <audio id="alarm-sound-${timerId}" src="${alarmSounds[0].url}" preload="auto"></audio>
            `;

            if (timerCount <= 3) {
                document.getElementById('timer-container').appendChild(timerDiv);
            } else {
                document.getElementById('extra-timer-container').appendChild(timerDiv);
            }
            
            audioPlayers[timerId] = document.getElementById(`alarm-sound-${timerId}`);
        }
        
        function changeSoundSource(timerId) {
            const select = document.getElementById(`sound-select-${timerId}`);
            const audio = document.getElementById(`alarm-sound-${timerId}`);
            audio.src = select.value;
            audio.load();
        }

        function testSound(timerId) {
            const audio = document.getElementById(`alarm-sound-${timerId}`);
            audio.currentTime = 0;
            audio.play().catch(e => console.log("播放失敗:", e));
        }

        function stopSound(timerId) {
            const audio = document.getElementById(`alarm-sound-${timerId}`);
            if (audio) {
                audio.pause();
                audio.currentTime = 0;
            }
        }
        
        function stopAllSounds() {
            for (const timerId in audioPlayers) {
                stopSound(timerId);
            }
        }

        function startTimer(timerId) {
            stopAllSounds();
            
            if (timers[timerId].interval) {
                clearInterval(timers[timerId].interval);
            }
            if (timers[timerId].retryTimeout) {
                clearTimeout(timers[timerId].retryTimeout);
                clearInterval(timers[timerId].retryCountdownInterval);
            }
            
            const timeToStart = parseInt(document.getElementById(`minutes-${timerId}`).value) * 60 + 
                               parseInt(document.getElementById(`seconds-${timerId}`).value);

            if (timeToStart <= 0) {
                 return;
            }

            const display = document.getElementById(`display-${timerId}`);
            const hourglass = document.getElementById(`hourglass-${timerId}`);
            const timerElement = document.getElementById(timerId);
            const acknowledgeBtn = document.getElementById(`acknowledge-${timerId}`);
            const retryCountdown = document.getElementById(`retry-countdown-${timerId}`);
            
            timers[timerId].remainingTime = timeToStart;
            timers[timerId].isPaused = false;
            
            timerElement.classList.remove('time-up');
            display.style.color = '#2c3e50';
            hourglass.classList.add('active');
            acknowledgeBtn.style.display = 'none';
            retryCountdown.style.display = 'none';
            document.getElementById(`pause-btn-${timerId}`).textContent = "暫停";


            function updateDisplay() {
                const minutes = Math.floor(timers[timerId].remainingTime / 60);
                const seconds = timers[timerId].remainingTime % 60;
                display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            updateDisplay();

            timers[timerId].interval = setInterval(function() {
                timers[timerId].remainingTime--;
                if (timers[timerId].remainingTime < 0) {
                    clearInterval(timers[timerId].interval);
                    timeUp(timerId);
                } else {
                    updateDisplay();
                }
            }, 1000);
            
            updateGlobalBGM();
        }

        function togglePauseTimer(timerId) {
            if (timers[timerId].interval) {
                clearInterval(timers[timerId].interval);
                timers[timerId].interval = null;
                timers[timerId].isPaused = true;
                document.getElementById(`pause-btn-${timerId}`).textContent = "繼續";
                document.getElementById(`hourglass-${timerId}`).classList.remove('active');
                stopSound(timerId);
                updateGlobalBGM();
            } else {
                if (timers[timerId].isPaused) {
                    const display = document.getElementById(`display-${timerId}`);
                    const hourglass = document.getElementById(`hourglass-${timerId}`);
                    
                    timers[timerId].isPaused = false;
                    document.getElementById(`pause-btn-${timerId}`).textContent = "暫停";
                    hourglass.classList.add('active');

                    function updateDisplay() {
                        const minutes = Math.floor(timers[timerId].remainingTime / 60);
                        const seconds = timers[timerId].remainingTime % 60;
                        display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    }

                    updateDisplay();
                    
                    timers[timerId].interval = setInterval(function() {
                        timers[timerId].remainingTime--;
                        if (timers[timerId].remainingTime < 0) {
                            clearInterval(timers[timerId].interval);
                            timeUp(timerId);
                        } else {
                            updateDisplay();
                        }
                    }, 1000);

                    updateGlobalBGM();
                } else {
                    showMessage('請先點擊「開始」來啟動計時器！');
                }
            }
        }

        function timeUp(timerId) {
            const display = document.getElementById(`display-${timerId}`);
            const hourglass = document.getElementById(`hourglass-${timerId}`);
            const timerElement = document.getElementById(timerId);
            const acknowledgeBtn = document.getElementById(`acknowledge-${timerId}`);
            const retryCountdown = document.getElementById(`retry-countdown-${timerId}`);
            const audio = document.getElementById(`alarm-sound-${timerId}`);

            hourglass.classList.remove('active');
            display.style.color = '#e74c3c';
            display.textContent = '時間到！';
            timerElement.classList.add('time-up');
            acknowledgeBtn.style.display = 'block';

            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("播放失敗:", e));
            }

            let countdown = 30;
            retryCountdown.style.display = 'block';
            retryCountdown.textContent = `${countdown} 秒後重新提醒`;

            timers[timerId].retryTimeout = setTimeout(() => {
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("播放失敗:", e));
                }
                countdown = 30;
            }, 30000);
            
            timers[timerId].retryCountdownInterval = setInterval(() => {
                countdown--;
                retryCountdown.textContent = `${countdown} 秒後重新提醒`;
                if (countdown <= 0) {
                    countdown = 30;
                }
            }, 1000);
            
            updateGlobalBGM();
        }

        function acknowledgeTimer(timerId) {
            const timerElement = document.getElementById(timerId);
            const acknowledgeBtn = document.getElementById(`acknowledge-${timerId}`);
            const retryCountdown = document.getElementById(`retry-countdown-${timerId}`);

            stopSound(timerId);
            
            timerElement.classList.remove('time-up');
            acknowledgeBtn.style.display = 'none';
            retryCountdown.style.display = 'none';
            
            if (timers[timerId].retryTimeout) {
                clearTimeout(timers[timerId].retryTimeout);
                timers[timerId].retryTimeout = null;
            }
            if (timers[timerId].retryCountdownInterval) {
                clearInterval(timers[timerId].retryCountdownInterval);
                timers[timerId].retryCountdownInterval = null;
            }
            
            updateGlobalBGM();
        }

        function resetTimer(timerId) {
            stopSound(timerId);
            
            if (timers[timerId].interval) {
                clearInterval(timers[timerId].interval);
                timers[timerId].interval = null;
            }
            if (timers[timerId].retryTimeout) {
                clearTimeout(timers[timerId].retryTimeout);
                timers[timerId].retryTimeout = null;
            }
            if (timers[timerId].retryCountdownInterval) {
                clearInterval(timers[timerId].retryCountdownInterval);
                timers[timerId].retryCountdownInterval = null;
            }
            
            timers[timerId].isPaused = false;
            
            const minutesInput = document.getElementById(`minutes-${timerId}`);
            const secondsInput = document.getElementById(`seconds-${timerId}`);
            const display = document.getElementById(`display-${timerId}`);
            const hourglass = document.getElementById(`hourglass-${timerId}`);
            const timerElement = document.getElementById(timerId);
            const acknowledgeBtn = document.getElementById(`acknowledge-${timerId}`);
            const retryCountdown = document.getElementById(`retry-countdown-${timerId}`);
            
            minutesInput.value = 5;
            secondsInput.value = 0;
            display.textContent = '05:00';
            display.style.color = '#2c3e50';
            hourglass.classList.remove('active');
            timerElement.classList.remove('time-up');
            acknowledgeBtn.style.display = 'none';
            retryCountdown.style.display = 'none';
            document.getElementById(`pause-btn-${timerId}`).textContent = "暫停";
            
            updateGlobalBGM();
        }

        window.onload = function() {
            addTimer();
        }
    </script>
