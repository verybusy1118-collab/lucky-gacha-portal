<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考試重要提醒</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'BpmfGenSenRounded-R';
            src: url('https://cdn.jsdelivr.net/gh/tadlearn/webfonts/BpmfGenSenRounded-R.woff2') format('woff2');
            font-display: swap;
        }
        .font-bopomofo {
            font-family: 'BpmfGenSenRounded-R', 'PingFang TC', 'Microsoft JhengHei', sans-serif !important;
            line-height: 1.5 !important;
        }
        
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .clock-font {
            font-family: 'Courier New', Courier, monospace !important;
            font-weight: bold;
        }

        .time-display {
            transition: color 1s ease;
        }
        
        .color-normal { color: #000000; }
        .color-stage1 { color: #16a34a; } /* 綠色 */
        .color-stage2 { color: #f97316; } /* 橘色 */
        .color-stage3 { color: #dc2626; } /* 紅色 */

        .schedule-item {
            transition: all 0.2s;
            cursor: pointer;
        }
        .schedule-item.active {
            background-color: #1e40af;
            color: white;
            border-color: #1e40af;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .schedule-item:not(.active):hover {
            background-color: #f3f4f6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        #gear-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #e5e7eb;
            color: #9ca3af;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 40;
        }
        #gear-btn:hover {
            color: #4b5563;
            border-color: #d1d5db;
            background: white;
            transform: rotate(90deg);
        }

        .bounce-animation {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col h-screen overflow-hidden">

    <!-- 頂部：所有考試科目順序 (Schedule) -->
    <div class="w-full mb-6 flex-shrink-0">
        <h2 class="text-lg font-bold text-gray-500 mb-2 border-b-2 border-gray-200 pb-1 flex justify-between items-center">
            <span>📋 今日考試日程 (點擊可切換當下考試科目)</span>
            <span class="text-sm font-normal bg-gray-100 px-2 py-1 rounded">可點擊齒輪或輸入 666 進入後台</span>
        </h2>
        <div id="schedule-container" class="flex gap-3 overflow-x-auto py-2 px-1">
            <!-- 動態插入日程 -->
        </div>
    </div>

    <!-- 內容區 -->
    <main class="flex-grow grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch min-h-0">
        
        <!-- 左側：時間資訊 -->
        <div class="flex flex-col border-4 border-black rounded-3xl p-4 md:p-8 bg-gray-50 overflow-hidden relative">
            
            <div class="my-auto w-full flex flex-col items-center space-y-4 md:space-y-6">
                <div class="text-center mb-2">
                    <h1 id="display-subject" class="text-4xl md:text-6xl font-extrabold tracking-widest text-blue-900 drop-shadow-sm leading-normal py-2">尚未選擇科目</h1>
                    <div id="subject-time-range" class="text-2xl font-bold text-gray-600 mt-1 md:mt-3">--:-- ~ --:--</div>
                </div>

            <!-- 現在時間 -->
            <div class="text-center flex-shrink-0">
                <h2 class="text-3xl font-bold text-gray-700 mb-1">現在時間</h2>
                <div id="current-time" class="text-6xl md:text-7xl clock-font tracking-tight color-normal">10:00:00</div>
            </div>

            <div class="h-1 w-full bg-gray-300 rounded-full my-2 flex-shrink-0"></div>

                <!-- 剩餘時間 -->
                <div class="text-center flex-col items-center w-full">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-700 mb-2">距離考試結束剩餘</h2>
                    <div id="remaining-time" class="text-7xl md:text-9xl clock-font tracking-tighter time-display color-normal leading-none mb-2 md:mb-4">--:--</div>
                </div>
            </div>
        </div>

        <!-- 右側：人數與注意事項 -->
        <div class="flex flex-col space-y-4 md:space-y-6 min-h-0">
            
            <!-- 大字幕提醒 (移至日期上方) -->
            <div id="large-reminder-container" class="w-full flex items-center justify-center flex-shrink-0 hidden">
                <div id="large-reminder" class="text-4xl md:text-6xl font-extrabold text-red-600 bounce-animation text-center w-full bg-red-50 border-4 border-red-500 rounded-3xl p-3 md:p-5 shadow-lg">
                    <i class="fa-solid fa-triangle-exclamation"></i> <span id="reminder-text"></span>
                </div>
            </div>

            <!-- 顯示日期 -->
            <div id="display-date" class="text-3xl font-bold text-gray-700 bg-gray-50 border-4 border-black rounded-3xl p-4 text-center hidden flex-shrink-0 tracking-wider"></div>

            <!-- 人數統計 -->
            <div class="grid grid-cols-3 gap-2 md:gap-4 border-4 border-black rounded-3xl p-4 bg-gray-50 text-center flex-shrink-0">
                <div>
                    <h3 class="text-xl md:text-2xl font-bold text-gray-600">應到人數</h3>
                    <div id="count-expected" class="text-5xl md:text-6xl font-extrabold mt-1 md:mt-2">0</div>
                </div>
                <div>
                    <h3 class="text-xl md:text-2xl font-bold text-gray-600">實到人數</h3>
                    <div id="count-actual" class="text-5xl md:text-6xl font-extrabold text-blue-600 mt-1 md:mt-2">0</div>
                </div>
                <div>
                    <h3 class="text-xl md:text-2xl font-bold text-gray-600">缺考人數</h3>
                    <div id="count-absent" class="text-5xl md:text-6xl font-extrabold text-red-600 mt-1 md:mt-2">0</div>
                </div>
            </div>

            <!-- 注意事項 -->
            <div class="flex-grow border-4 border-black rounded-3xl p-6 bg-white overflow-hidden flex flex-col">
                <h2 class="text-3xl font-bold border-b-4 border-black pb-4 mb-5 flex items-center gap-3">
                    <i class="fa-solid fa-bullhorn text-yellow-500"></i> 考試注意事項
                </h2>
                <ul id="notes-list" class="columns-1 lg:columns-2 gap-8 text-2xl font-bold list-disc list-inside leading-relaxed text-gray-800">
                    <!-- 動態生成注意事項 -->
                </ul>
            </div>

        </div>

    </main>

    <!-- 齒輪按鈕 -->
    <button id="gear-btn" onclick="openSettings()" title="設定 (快捷鍵 666)">
        <i class="fa-solid fa-gear"></i>
    </button>

    <!-- 後台設定 Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh]">
            <div class="bg-gray-800 px-6 py-4 flex justify-between items-center text-white flex-shrink-0">
                <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-gear"></i> 考試設定後台</h2>
                <button onclick="closeSettings()" class="text-gray-300 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-grow space-y-6 text-base bg-gray-50">
                
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                    <!-- 左欄：科目排程設定 -->
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 lg:col-span-3">
                        <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2"><i class="fa-solid fa-list-ol text-blue-500"></i> 考試科目排程設定</h3>
                        
                        <div id="setting-schedule-list" class="space-y-3 mb-4 max-h-[300px] overflow-y-auto pr-2">
                            <!-- JS 動態插入排程輸入框 -->
                        </div>
                        
                        <button onclick="addScheduleItem()" class="w-full py-2 border-2 border-dashed border-blue-300 text-blue-600 rounded-lg font-bold hover:bg-blue-50 transition">
                            <i class="fa-solid fa-plus"></i> 新增考試科目
                        </button>
                    </div>

                    <!-- 右欄：其他設定 -->
                    <div class="space-y-6 lg:col-span-2">
                        
                        <!-- 日期設定 -->
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2"><i class="fa-solid fa-calendar-days text-orange-500"></i> 考試日期設定</h3>
                            <div>
                                <input type="date" id="setting-date" class="w-full border rounded-lg px-3 py-2 text-lg font-bold text-gray-700">
                            </div>
                        </div>

                        <!-- 變色提醒設定 -->
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2"><i class="fa-solid fa-palette text-pink-500"></i> 三階段倒數變色提醒</h3>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <label class="font-bold text-green-600 flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-green-600"></div> 第一階段 (綠色)</label>
                                    <div class="flex items-center gap-2">倒數 <input type="number" id="setting-stage1" min="1" class="w-16 border rounded px-2 py-1 text-center font-bold"> 分鐘</div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <label class="font-bold text-orange-500 flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-orange-500"></div> 第二階段 (橘色)</label>
                                    <div class="flex items-center gap-2">倒數 <input type="number" id="setting-stage2" min="1" class="w-16 border rounded px-2 py-1 text-center font-bold"> 分鐘</div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <label class="font-bold text-red-600 flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-red-600"></div> 第三階段 (紅色)</label>
                                    <div class="flex items-center gap-2">倒數 <input type="number" id="setting-stage3" min="1" class="w-16 border rounded px-2 py-1 text-center font-bold"> 分鐘</div>
                                </div>
                            </div>
                        </div>

                        <!-- 大字幕文字提醒設定 (可自訂新增) -->
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2"><i class="fa-solid fa-message text-indigo-500"></i> 大字幕文字提醒設定</h3>
                            
                            <div id="setting-reminders-list" class="space-y-3 mb-3 max-h-[200px] overflow-y-auto pr-2">
                                <!-- JS 動態插入 -->
                            </div>
                            
                            <button onclick="addReminderItem()" class="w-full py-2 border-2 border-dashed border-indigo-300 text-indigo-600 rounded-lg font-bold hover:bg-indigo-50 transition">
                                <i class="fa-solid fa-plus"></i> 新增提醒
                            </button>
                        </div>

                        <!-- 人數設定 -->
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2"><i class="fa-solid fa-users text-indigo-500"></i> 班級人數設定</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-gray-700 font-bold mb-1">應到人數</label>
                                    <input type="number" id="setting-expected" min="0" class="w-full border rounded-lg px-3 py-2 text-lg font-bold">
                                </div>
                                <div>
                                    <label class="block text-gray-700 font-bold mb-1">實到人數</label>
                                    <input type="number" id="setting-actual" min="0" class="w-full border rounded-lg px-3 py-2 text-lg font-bold">
                                </div>
                            </div>
                        </div>

                        <!-- 注音字型設定 -->
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2"><i class="fa-solid fa-language text-purple-500"></i> 注音顯示設定</h3>
                            <div class="flex items-center gap-3">
                                <input type="checkbox" id="setting-bopomofo" class="w-6 h-6 cursor-pointer">
                                <label for="setting-bopomofo" class="font-bold text-gray-700 cursor-pointer text-lg">啟用加註注音版本 (適合低年級)</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 注意事項 -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2"><i class="fa-solid fa-pen-to-square text-teal-500"></i> 注意事項 (每行一點)</h3>
                    <textarea id="setting-notes" rows="4" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-blue-500 focus:outline-none resize-none font-medium" placeholder="請將手機關機並收到書包內&#10;作答完畢請安靜檢查&#10;鐘聲響畢請立刻停筆"></textarea>
                </div>

            </div>

            <div class="bg-gray-100 px-6 py-4 flex justify-end gap-3 border-t flex-shrink-0">
                <button onclick="closeSettings()" class="px-6 py-2 rounded-lg bg-gray-300 text-gray-800 hover:bg-gray-400 font-bold transition">取消</button>
                <button onclick="saveSettings()" class="px-8 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-bold flex items-center gap-2 shadow-lg transition transform hover:scale-105">
                    <i class="fa-solid fa-floppy-disk"></i> 儲存設定
                </button>
            </div>
        </div>
    </div>

    <script>
        // 資料結構
        let examData = {
            examDate: '',
            schedule: [
                { id: '1', subject: '國語科 期中考', startTime: { ampm: 'AM', h: '08', m: '00' }, endTime: { ampm: 'AM', h: '09', m: '00' } },
                { id: '2', subject: '數學科 期中考', startTime: { ampm: 'AM', h: '09', m: '10' }, endTime: { ampm: 'AM', h: '10', m: '10' } },
                { id: '3', subject: '英文科 期中考', startTime: { ampm: 'AM', h: '10', m: '20' }, endTime: { ampm: 'AM', h: '11', m: '20' } }
            ],
            activeScheduleId: '1',
            stages: {
                stage1: 10,
                stage2: 5,
                stage3: 1
            },
            textReminders: [
                { id: 'r1', enabled: true, minutes: 5, text: '把握時間答題' },
                { id: 'r2', enabled: true, minutes: 3, text: '記得多檢查' }
            ],
            expected: 30,
            actual: 30,
            notes: "請將手機關機並收到書包內\n作答完畢請安靜檢查\n鐘聲響畢請立刻停筆",
            enableBopomofo: false
        };

        let editingSchedule = [];
        let editingReminders = [];

        document.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('examRemindersDataAdvanced5');
            if (savedData) {
                try {
                    examData = { ...examData, ...JSON.parse(savedData) };
                } catch (e) {
                    console.error('Error parsing saved data');
                }
            }
            
            // 防呆補齊資料結構
            if (!examData.textReminders || examData.textReminders.length === 0) {
                examData.textReminders = [
                    { id: 'r1', enabled: true, minutes: 5, text: '把握時間答題' },
                    { id: 'r2', enabled: true, minutes: 3, text: '記得多檢查' }
                ];
            }

            // 確保有 active ID
            if (!examData.schedule.find(s => s.id === examData.activeScheduleId) && examData.schedule.length > 0) {
                examData.activeScheduleId = examData.schedule[0].id;
            }

            updateDisplayFromData();
            startClock();
            
            let keyBuffer = '';
            document.addEventListener('keydown', (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
                keyBuffer += e.key;
                if (keyBuffer.length > 3) keyBuffer = keyBuffer.substring(1);
                if (keyBuffer === '666') {
                    openSettings();
                    keyBuffer = '';
                }
            });
        });

        // 輔助函式：時間物件轉換為 24 小時制的 Date 物件
        function getExamTimeDate(timeObj, baseDate) {
            let h = parseInt(timeObj.h);
            const m = parseInt(timeObj.m);
            if (timeObj.ampm === 'PM' && h !== 12) h += 12;
            if (timeObj.ampm === 'AM' && h === 12) h = 0; // 12 AM is 00:00
            
            const d = new Date(baseDate);
            d.setHours(h, m, 0, 0);
            return d;
        }

        // 輔助函式：格式化時間物件為字串 (例如 "08:00")
        function formatTimeObj(timeObj) {
            let h = parseInt(timeObj.h);
            if (timeObj.ampm === 'PM' && h !== 12) h += 12;
            if (timeObj.ampm === 'AM' && h === 12) h = 0;
            return `${String(h).padStart(2, '0')}:${String(timeObj.m).padStart(2, '0')}`;
        }

        // ================= 前台顯示 =================

        function setActiveSubject(id) {
            examData.activeScheduleId = id;
            localStorage.setItem('examRemindersDataAdvanced5', JSON.stringify(examData));
            updateDisplayFromData();
        }

        function updateDisplayFromData() {
            if (examData.enableBopomofo) {
                document.body.classList.add('font-bopomofo');
            } else {
                document.body.classList.remove('font-bopomofo');
            }

            const scheduleContainer = document.getElementById('schedule-container');
            scheduleContainer.innerHTML = '';
            
            const dateEl = document.getElementById('display-date');
            if (examData.examDate) {
                const d = new Date(examData.examDate);
                if (!isNaN(d)) {
                    dateEl.textContent = `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,'0')}月${String(d.getDate()).padStart(2,'0')}日`;
                    dateEl.classList.remove('hidden');
                } else {
                    dateEl.classList.add('hidden');
                }
            } else {
                dateEl.classList.add('hidden');
            }

            const now = new Date();
            
            let activeSubExists = false;
            let firstUnfinishedId = null;

            examData.schedule.forEach(item => {
                const endDate = getExamTimeDate(item.endTime, now);
                const isFinished = now > endDate;
                if (!isFinished && !firstUnfinishedId) {
                    firstUnfinishedId = item.id;
                }
                if (item.id === examData.activeScheduleId) {
                    activeSubExists = true;
                    if (isFinished) {
                        activeSubExists = false; 
                    }
                }
            });

            if (!activeSubExists && firstUnfinishedId) {
                examData.activeScheduleId = firstUnfinishedId;
            }

            let renderedCount = 0;
            examData.schedule.forEach((item, index) => {
                const endDate = getExamTimeDate(item.endTime, now);
                if (now > endDate) {
                    return; 
                }
                renderedCount++;

                const isActive = item.id === examData.activeScheduleId;
                const startTimeStr = formatTimeObj(item.startTime);
                const endTimeStr = formatTimeObj(item.endTime);
                
                const btn = document.createElement('div');
                btn.className = `schedule-item px-5 py-2 rounded-xl border-2 font-bold text-lg flex items-center gap-2 whitespace-nowrap select-none ${isActive ? 'active' : 'border-gray-300 text-gray-600 bg-white'}`;
                btn.innerHTML = `<span class="bg-black/10 px-2 py-0.5 rounded text-sm">${index+1}</span> ${item.subject} <span class="text-sm font-normal opacity-90">(${startTimeStr}~${endTimeStr})</span>`;
                btn.onclick = () => setActiveSubject(item.id);
                scheduleContainer.appendChild(btn);

                if (isActive) {
                    document.getElementById('display-subject').textContent = item.subject;
                    document.getElementById('subject-time-range').textContent = `${startTimeStr} ~ ${endTimeStr}`;
                }
            });

            if (renderedCount === 0) {
                scheduleContainer.innerHTML = '<div class="text-gray-400 italic">今日排程均已結束</div>';
                document.getElementById('display-subject').textContent = '考試結束';
                document.getElementById('subject-time-range').textContent = '--:-- ~ --:--';
                examData.activeScheduleId = null;
            }

            const expected = parseInt(examData.expected) || 0;
            const actual = parseInt(examData.actual) || 0;
            const absent = Math.max(0, expected - actual);

            document.getElementById('count-expected').textContent = expected;
            document.getElementById('count-actual').textContent = actual;
            document.getElementById('count-absent').textContent = absent;
            document.getElementById('count-absent').className = absent > 0 ? "text-5xl md:text-6xl font-extrabold text-red-600 mt-1 md:mt-2" : "text-5xl md:text-6xl font-extrabold text-gray-400 mt-1 md:mt-2";

            if (window.notesInterval) {
                clearInterval(window.notesInterval);
                window.notesInterval = null;
            }

            const allNotes = examData.notes ? examData.notes.split('\n').filter(n => n.trim()) : [];
            window.currentNotePage = 0;
            const itemsPerPage = 2;

            function renderNotesPage() {
                const notesList = document.getElementById('notes-list');
                notesList.innerHTML = '';
                if (allNotes.length === 0) return;
                
                const startIndex = window.currentNotePage * itemsPerPage;
                let pageNotes = allNotes.slice(startIndex, startIndex + itemsPerPage);
                
                pageNotes.forEach(note => {
                    const li = document.createElement('li');
                    li.className = 'break-inside-avoid mb-5 fade-in';
                    li.textContent = note;
                    notesList.appendChild(li);
                });
            }

            renderNotesPage();

            if (allNotes.length > itemsPerPage) {
                // 每 15 秒輪播一次 (避免 5 分鐘過久導致有些學生看不到後面的注意事項)
                // 若堅持要 5 分鐘，可改為 5 * 60 * 1000
                window.notesInterval = setInterval(() => {
                    const totalPages = Math.ceil(allNotes.length / itemsPerPage);
                    window.currentNotePage = (window.currentNotePage + 1) % totalPages;
                    renderNotesPage();
                }, 15000); 
            }

            updateTimer();
        }

        // ================= 時鐘與倒數邏輯 =================

        let lastSeconds = -1;

        function startClock() {
            setInterval(() => {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('current-time').textContent = `${h}:${m}:${s}`;
                updateTimer(now);
            }, 1000);
        }

        function updateTimer(nowDate = new Date()) {
            const remainingEl = document.getElementById('remaining-time');
            const reminderEl = document.getElementById('large-reminder');
            
            const activeSub = examData.schedule.find(s => s.id === examData.activeScheduleId);
            
            if (!activeSub || !activeSub.endTime) {
                remainingEl.textContent = '--:--';
                remainingEl.className = 'text-7xl md:text-9xl clock-font tracking-tighter time-display color-normal leading-none mb-4';
                reminderEl.classList.add('hidden');
                return;
            }

            const endDate = getExamTimeDate(activeSub.endTime, nowDate);
            const startDate = getExamTimeDate(activeSub.startTime, nowDate);
            
            if (nowDate.getTime() < startDate.getTime()) {
                if (remainingEl.textContent !== '尚未開始') {
                    remainingEl.textContent = '尚未開始';
                    remainingEl.className = 'text-6xl md:text-7xl font-bold tracking-widest text-gray-400 mb-2 md:mb-4';
                    reminderEl.classList.add('hidden');
                }
                lastSeconds = -1;
                return;
            }

            let diffMs = endDate.getTime() - nowDate.getTime();

            if (diffMs < -1000) {
                updateDisplayFromData();
                return;
            }

            if (diffMs <= 0) {
                remainingEl.textContent = '00:00';
                remainingEl.className = 'text-7xl md:text-9xl clock-font tracking-tighter time-display color-stage3 leading-none mb-4';
                reminderEl.classList.add('hidden');
                return;
            }

            const totalSeconds = Math.floor(diffMs / 1000);
            
            if (totalSeconds === lastSeconds) return;
            lastSeconds = totalSeconds;

            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            remainingEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // 動態文字提醒邏輯
            let activeReminderText = null;
            if (totalSeconds > 0) {
                // 找出所有符合條件 (剩餘秒數 <= 設定的分鐘數*60) 且啟用的提醒，選擇分鐘數最小的那個
                const validReminders = (examData.textReminders || [])
                    .filter(r => r.enabled && totalSeconds <= r.minutes * 60)
                    .sort((a, b) => a.minutes - b.minutes); // 由小排到大
                
                if (validReminders.length > 0) {
                    activeReminderText = validReminders[0].text;
                }
            }

            if (activeReminderText) {
                document.getElementById('reminder-text').textContent = activeReminderText;
                document.getElementById('large-reminder-container').classList.remove('hidden');
            } else {
                document.getElementById('large-reminder-container').classList.add('hidden');
            }

            const stage3Ms = (examData.stages.stage3 || 1) * 60 * 1000;
            const stage2Ms = (examData.stages.stage2 || 5) * 60 * 1000;
            const stage1Ms = (examData.stages.stage1 || 10) * 60 * 1000;

            let colorClass = 'color-normal';
            if (diffMs <= stage3Ms) {
                colorClass = 'color-stage3'; // 紅
            } else if (diffMs <= stage2Ms) {
                colorClass = 'color-stage2'; // 橘
            } else if (diffMs <= stage1Ms) {
                colorClass = 'color-stage1'; // 綠
            }

            remainingEl.className = `text-7xl md:text-9xl clock-font tracking-tighter time-display ${colorClass} leading-none mb-4`;
        }

        // ================= 後台設定邏輯 =================

        function openSettings() {
            editingSchedule = JSON.parse(JSON.stringify(examData.schedule));
            renderSettingScheduleList();

            editingReminders = JSON.parse(JSON.stringify(examData.textReminders || []));
            renderSettingRemindersList();

            document.getElementById('setting-date').value = examData.examDate || '';
            document.getElementById('setting-stage1').value = examData.stages.stage1;
            document.getElementById('setting-stage2').value = examData.stages.stage2;
            document.getElementById('setting-stage3').value = examData.stages.stage3;
            
            document.getElementById('setting-expected').value = examData.expected;
            document.getElementById('setting-actual').value = examData.actual;
            document.getElementById('setting-notes').value = examData.notes;
            document.getElementById('setting-bopomofo').checked = examData.enableBopomofo || false;
            
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const listEl = document.getElementById('setting-schedule-list');
            const rows = listEl.querySelectorAll('.schedule-row');
            const newSchedule = [];
            rows.forEach((row) => {
                const id = row.dataset.id;
                const subject = row.querySelector('.sch-subject').value;
                
                const sAmpm = row.querySelector('.sch-s-ampm').value;
                const sH = row.querySelector('.sch-s-h').value;
                const sM = row.querySelector('.sch-s-m').value;
                
                const eAmpm = row.querySelector('.sch-e-ampm').value;
                const eH = row.querySelector('.sch-e-h').value;
                const eM = row.querySelector('.sch-e-m').value;

                if(subject) {
                    newSchedule.push({ 
                        id, 
                        subject, 
                        startTime: { ampm: sAmpm, h: sH, m: sM }, 
                        endTime: { ampm: eAmpm, h: eH, m: eM } 
                    });
                }
            });
            examData.schedule = newSchedule;

            saveCurrentEditingReminders();
            examData.textReminders = JSON.parse(JSON.stringify(editingReminders));

            examData.examDate = document.getElementById('setting-date').value;

            examData.stages.stage1 = parseInt(document.getElementById('setting-stage1').value) || 10;
            examData.stages.stage2 = parseInt(document.getElementById('setting-stage2').value) || 5;
            examData.stages.stage3 = parseInt(document.getElementById('setting-stage3').value) || 1;
            
            examData.expected = document.getElementById('setting-expected').value;
            examData.actual = document.getElementById('setting-actual').value;
            examData.notes = document.getElementById('setting-notes').value;
            examData.enableBopomofo = document.getElementById('setting-bopomofo').checked;

            localStorage.setItem('examRemindersDataAdvanced5', JSON.stringify(examData));

            updateDisplayFromData();
            closeSettings();
        }

        // --- 排程清單渲染 ---
        function getHourOptions(selected) {
            let opts = '';
            for(let i=1; i<=12; i++) {
                const val = String(i).padStart(2, '0');
                opts += `<option value="${val}" ${selected===val?'selected':''}>${val}</option>`;
            }
            return opts;
        }

        function getMinuteOptions(selected) {
            let opts = '';
            for(let i=0; i<=59; i++) {
                const val = String(i).padStart(2, '0');
                opts += `<option value="${val}" ${selected===val?'selected':''}>${val}</option>`;
            }
            return opts;
        }

        function renderSettingScheduleList() {
            const container = document.getElementById('setting-schedule-list');
            container.innerHTML = '';
            if(editingSchedule.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-center py-2">目前沒有任何科目，請點擊下方新增</div>';
            }
            editingSchedule.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'schedule-row flex items-center flex-wrap gap-2 bg-gray-50 p-2 rounded border border-gray-200';
                row.dataset.id = item.id;
                
                row.innerHTML = `
                    <div class="font-bold text-gray-500 w-6 text-center shrink-0">${index+1}</div>
                    <input type="text" class="sch-subject flex-grow min-w-[120px] border rounded px-2 py-1.5 text-sm focus:border-blue-500 outline-none" value="${item.subject}" placeholder="科目名稱">
                    
                    <div class="flex items-center gap-1 shrink-0 bg-white border p-1 rounded">
                        <span class="text-xs text-gray-500">起</span>
                        <select class="sch-s-ampm border-none bg-transparent text-sm focus:outline-none">
                            <option value="AM" ${item.startTime.ampm==='AM'?'selected':''}>上午</option>
                            <option value="PM" ${item.startTime.ampm==='PM'?'selected':''}>下午</option>
                        </select>
                        <select class="sch-s-h border-none bg-transparent text-sm focus:outline-none">${getHourOptions(item.startTime.h)}</select>
                        <span>:</span>
                        <select class="sch-s-m border-none bg-transparent text-sm focus:outline-none">${getMinuteOptions(item.startTime.m)}</select>
                    </div>

                    <div class="flex items-center gap-1 shrink-0 bg-white border p-1 rounded">
                        <span class="text-xs text-gray-500">迄</span>
                        <select class="sch-e-ampm border-none bg-transparent text-sm focus:outline-none">
                            <option value="AM" ${item.endTime.ampm==='AM'?'selected':''}>上午</option>
                            <option value="PM" ${item.endTime.ampm==='PM'?'selected':''}>下午</option>
                        </select>
                        <select class="sch-e-h border-none bg-transparent text-sm focus:outline-none">${getHourOptions(item.endTime.h)}</select>
                        <span>:</span>
                        <select class="sch-e-m border-none bg-transparent text-sm focus:outline-none">${getMinuteOptions(item.endTime.m)}</select>
                    </div>

                    <button onclick="removeScheduleItem('${item.id}')" class="text-red-500 hover:text-red-700 p-2 shrink-0"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(row);
            });
        }

        function addScheduleItem() {
            const newId = Date.now().toString();
            let s = { ampm: 'AM', h: '08', m: '00' };
            let e = { ampm: 'AM', h: '09', m: '00' };
            
            if (editingSchedule.length > 0) {
                const lastEnd = editingSchedule[editingSchedule.length-1].endTime;
                if (lastEnd) {
                    s = { ...lastEnd };
                    e = { ...lastEnd };
                    let nextH = parseInt(e.h) + 1;
                    if (nextH > 12) {
                        nextH = 1;
                        e.ampm = (e.ampm === 'AM') ? 'PM' : 'AM';
                    }
                    e.h = String(nextH).padStart(2, '0');
                }
            }

            editingSchedule.push({ id: newId, subject: '', startTime: s, endTime: e });
            renderSettingScheduleList();
            
            const listEl = document.getElementById('setting-schedule-list');
            listEl.scrollTop = listEl.scrollHeight;
        }

        function removeScheduleItem(id) {
            const rows = document.querySelectorAll('.schedule-row');
            editingSchedule = Array.from(rows).map(row => ({
                id: row.dataset.id,
                subject: row.querySelector('.sch-subject').value,
                startTime: {
                    ampm: row.querySelector('.sch-s-ampm').value,
                    h: row.querySelector('.sch-s-h').value,
                    m: row.querySelector('.sch-s-m').value
                },
                endTime: {
                    ampm: row.querySelector('.sch-e-ampm').value,
                    h: row.querySelector('.sch-e-h').value,
                    m: row.querySelector('.sch-e-m').value
                }
            }));

            editingSchedule = editingSchedule.filter(item => item.id !== id);
            renderSettingScheduleList();
        }

        // --- 大字幕提醒清單渲染 ---
        function renderSettingRemindersList() {
            const container = document.getElementById('setting-reminders-list');
            container.innerHTML = '';
            if(editingReminders.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-center py-2">目前沒有任何大字幕提醒</div>';
            }
            editingReminders.forEach((item) => {
                const row = document.createElement('div');
                row.className = 'reminder-row flex items-center gap-2 bg-gray-50 p-2 rounded border border-gray-200';
                row.dataset.id = item.id;
                
                row.innerHTML = `
                    <input type="checkbox" class="rem-en w-5 h-5 cursor-pointer shrink-0" ${item.enabled ? 'checked' : ''} title="打勾表示啟用">
                    <label class="font-bold text-gray-700 whitespace-nowrap text-sm shrink-0">倒數</label>
                    <input type="number" class="rem-min w-16 border rounded px-1 py-1 text-center font-bold text-sm shrink-0" min="1" value="${item.minutes}">
                    <label class="font-bold text-gray-700 whitespace-nowrap text-sm shrink-0">分:</label>
                    <input type="text" class="rem-text flex-grow border rounded px-2 py-1 font-bold text-sm focus:border-indigo-500 outline-none" value="${item.text}" placeholder="提醒文字 (例如：把握時間)">
                    <button onclick="removeReminderItem('${item.id}')" class="text-red-500 hover:text-red-700 p-2 shrink-0"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(row);
            });
        }

        function addReminderItem() {
            saveCurrentEditingReminders();
            const newId = 'r' + Date.now().toString();
            editingReminders.push({ id: newId, enabled: true, minutes: 1, text: '' });
            renderSettingRemindersList();
            const listEl = document.getElementById('setting-reminders-list');
            listEl.scrollTop = listEl.scrollHeight;
        }

        function removeReminderItem(id) {
            saveCurrentEditingReminders();
            editingReminders = editingReminders.filter(item => item.id !== id);
            renderSettingRemindersList();
        }

        function saveCurrentEditingReminders() {
            const rows = document.querySelectorAll('.reminder-row');
            editingReminders = Array.from(rows).map(row => ({
                id: row.dataset.id,
                enabled: row.querySelector('.rem-en').checked,
                minutes: parseInt(row.querySelector('.rem-min').value) || 1,
                text: row.querySelector('.rem-text').value
            }));
        }
    </script>
